name: Apply staged audit changes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/full-addon-simulation-pipeline-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-addon-simulation-pipeline-audit
          fetch-depth: 0
      - name: Decode and verify audit patch
        if: hashFiles('.github/audit-changes.patch.gz.b64') != ''
        run: |
          set -euo pipefail
          base64 --decode .github/audit-changes.patch.gz.b64 | gzip -dc > /tmp/cloth-next-audit.patch
          echo "db7dab40a3b613c5b3c9214fc0b84320656089a977d26957072c90ab1a79ef7b  /tmp/cloth-next-audit.patch" | sha256sum --check --strict
          git apply --check /tmp/cloth-next-audit.patch
      - name: Apply and commit audit changes
        if: hashFiles('.github/audit-changes.patch.gz.b64') != ''
        run: |
          set -euo pipefail
          git apply /tmp/cloth-next-audit.patch
          rm .github/audit-changes.patch.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix addon lifecycle and simulation pipeline"
          git push origin HEAD:agent/full-addon-simulation-pipeline-audit
