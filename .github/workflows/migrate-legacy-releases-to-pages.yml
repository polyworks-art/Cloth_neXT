name: migrate-legacy-releases-to-pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-legacy-releases-to-pages.yml"

permissions:
  contents: write

concurrency:
  group: migrate-legacy-releases-to-pages
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Migrate selected releases and clear the public release list
        run: python tools/_migrate_legacy_releases_once.py
