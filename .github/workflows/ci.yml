# Cloth NeXt CI — runs on every push and pull request.
# Never publishes anything; releases go through release.yml only.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  BLENDER_VERSION: "5.0.0"
  BLENDER_SERIES: "5.0"
  PYTHON_VERSION: "3.11"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: pip install -r requirements-build.txt

      # The real PPF integration test is never collected here; it stays
      # available for explicitly configured local/Windows runs via
      # `pytest -m integration`.
      - name: Unit tests (integration tests excluded)
        run: pytest -m "not integration and not built_artifact"

      - name: Validate extension source structure
        run: python tools/validate_extension.py cloth_next --phase source

  blender-smoke:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender download
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: blender.tar.xz
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" -o blender.tar.xz

      - name: Extract Blender
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xf blender.tar.xz -C "$RUNNER_TEMP/blender" --strip-components=1
          echo "BLENDER=$RUNNER_TEMP/blender/blender" >> "$GITHUB_ENV"

      - name: Build extension with the official Blender tooling
        run: |
          set -euo pipefail
          mkdir -p dist
          "$BLENDER" --command extension build \
            --source-dir=cloth_next --output-filepath=dist/cloth_next-smoke.zip

      - name: Install the extension into Blender (bl_ext namespace)
        run: |
          set -euo pipefail
          "$BLENDER" --command extension install-file \
            --repo user_default --enable dist/cloth_next-smoke.zip

      - name: Real registration smoke test
        run: |
          set -euo pipefail
          "$BLENDER" --background \
            --python-exit-code 1 --python tools/blender_smoke_test.py

      - name: Quick Assign registration and role dispatch
        run: '"$BLENDER" --background --factory-startup --python-exit-code 1 --python tools/blender_quick_assign_smoke.py'

      - name: Pull detach registration and playback smoke
        run: '"$BLENDER" --background --factory-startup --python-exit-code 1 --python tools/blender_pull_detach_smoke.py'

      - name: Linked Collider sharing and persistence smoke
        run: '"$BLENDER" --background --factory-startup --python-exit-code 1 --python tools/blender_linked_colliders_smoke.py'

      - name: Real floating UI gestures on a virtual display
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          for script in tools/blender_quick_assign_smoke.py tools/blender_pull_detach_smoke.py tools/blender_linked_colliders_smoke.py; do
            timeout 120s xvfb-run -a "$BLENDER" --factory-startup --enable-event-simulate --python-exit-code 1 --python "$script" -- --events
          done

      - name: Rod and Soft Body workflow smoke test
        run: |
          set -euo pipefail
          "$BLENDER" --background \
            --python-exit-code 1 --python tools/blender_rod_softbody_smoke.py

      - name: Multi-object workflow smoke test
        run: |
          set -euo pipefail
          "$BLENDER" --background \
            --python-exit-code 1 --python tools/blender_multi_object_smoke.py

      - name: Collider proxy and character cage smoke test
        run: |
          set -euo pipefail
          "$BLENDER" --background \
            --python-exit-code 1 --python tools/blender_collider_proxy_smoke.py

      - name: Animated Collider cache identity smoke test
        timeout-minutes: 2
        run: |
          set -euo pipefail
          "$BLENDER" --factory-startup --background \
            --python-exit-code 1 \
            --python tools/blender_animated_collider_cache_smoke.py

      # Exercises the update operator against Blender's real extension
      # machinery, including a sync of the live Beta channel repository.
      - name: Add-on update path smoke test
        timeout-minutes: 3
        run: |
          set -euo pipefail
          BLENDER_USER_RESOURCES="$RUNNER_TEMP/blender-update-profile" \
            "$BLENDER" --factory-startup --background --online-mode \
            --python-exit-code 1 --python tools/blender_update_smoke_test.py

  linux-companion-extension:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements-build.txt
      - name: Install Tk and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: Build native Linux Companion
        run: python companion/build_companion.py
      - name: Exercise Companion IPC and information modes
        run: timeout 90s xvfb-run -a python tools/verify_companion.py
      - name: Stage and package linux-x64 extension
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("cloth_next/blender_manifest.toml","rb"))["version"])')"
          python tools/stage_companion.py "companion/dist/Cloth NeXt Bake"
          python tools/build_extension.py --output "dist/cloth_next-$VERSION-linux-x64.zip"
          echo "LINUX_ZIP=dist/cloth_next-$VERSION-linux-x64.zip" >> "$GITHUB_ENV"
      - run: pytest -m built_artifact --extension-zip "$LINUX_ZIP"
      - run: python tools/validate_extension.py "$LINUX_ZIP" --phase packaged
      - run: python tools/scan_release_artifact.py "$LINUX_ZIP"
