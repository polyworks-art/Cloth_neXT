name: One-time Dev 2.1.22 watcher

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  issues: write
  contents: write

jobs:
  watch:
    if: >-
      github.event.issue.number == 28 &&
      github.event.comment.user.login == 'polyworks-art' &&
      github.event.comment.body == '/watch-dev-2.1.22'
    runs-on: ubuntu-latest
    steps:
      - name: Watch publish-dev and report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'cloth-next-dev-watcher',
          }

          def get_json(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                  return json.load(response)

          def post_json(url, payload):
              data = json.dumps(payload).encode('utf-8')
              request = urllib.request.Request(url, data=data, headers=headers, method='POST')
              with urllib.request.urlopen(request) as response:
                  return json.load(response) if response.length else None

          runs_url = f'https://api.github.com/repos/{repo}/actions/workflows/publish-dev.yml/runs?event=workflow_dispatch&per_page=10'
          run = None
          for _ in range(20):
              runs = get_json(runs_url).get('workflow_runs', [])
              candidates = [item for item in runs if item.get('name') == 'publish-dev']
              if candidates:
                  run = candidates[0]
                  break
              time.sleep(6)
          if run is None:
              raise RuntimeError('No publish-dev workflow_dispatch run found')

          run_url = run['url']
          for _ in range(100):
              run = get_json(run_url)
              if run.get('status') == 'completed':
                  break
              time.sleep(12)
          else:
              raise RuntimeError('publish-dev did not finish within the watcher window')

          jobs = get_json(run['jobs_url']).get('jobs', [])
          failed = []
          completed = []
          for job in jobs:
              for step in job.get('steps') or []:
                  name = step.get('name', 'unnamed step')
                  conclusion = step.get('conclusion')
                  if conclusion == 'failure':
                      failed.append(f"{job.get('name', 'job')} → {name}")
                  elif conclusion == 'success':
                      completed.append(f"{job.get('name', 'job')} → {name}")

          conclusion = run.get('conclusion', 'unknown')
          body = [
              f"## Dev 2.1.22 publish: **{conclusion}**",
              '',
              f"- Source commit: `5bef12ea4e9c60279c0cafc5315d2a097182db6f`",
              f"- Workflow run: {run.get('html_url')}",
          ]
          if failed:
              body.extend(['', '**Failed steps**'] + [f"- {item}" for item in failed])
          else:
              body.extend(['', '- No failed workflow steps reported.'])
          post_json(f'https://api.github.com/repos/{repo}/issues/28/comments', {'body': '\n'.join(body)})

          workflow_path = '.github/workflows/watch-dev-2.1.22-once.yml'
          quoted = urllib.parse.quote(workflow_path, safe='/')
          current = get_json(f'https://api.github.com/repos/{repo}/contents/{quoted}?ref=main')
          delete_payload = json.dumps({
              'message': 'Remove completed Dev 2.1.22 watcher',
              'sha': current['sha'],
              'branch': 'main',
          }).encode('utf-8')
          delete_request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/contents/{quoted}',
              data=delete_payload, headers=headers, method='DELETE')
          with urllib.request.urlopen(delete_request):
              pass

          if conclusion != 'success':
              raise SystemExit(1)
          PY
