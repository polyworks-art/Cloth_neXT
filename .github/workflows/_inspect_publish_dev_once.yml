name: inspect-publish-dev-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_inspect_publish_dev_once.yml"

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inspect recent publish-dev runs
        shell: bash
        run: |
          set -euo pipefail
          report="_publish_dev_diagnostics.txt"
          printf 'Recent publish-dev runs\n=======================\n' > "$report"
          gh run list --workflow publish-dev.yml --limit 12 --json databaseId,status,conclusion,createdAt,headSha,event,url >> "$report"
          printf '\n\nRelevant log excerpts\n=====================\n' >> "$report"
          for id in $(gh run list --workflow publish-dev.yml --limit 12 --json databaseId --jq '.[].databaseId'); do
            printf '\n--- RUN %s ---\n' "$id" >> "$report"
            gh run view "$id" --log 2>&1 | grep -E -i '2\.1\.29|already exists|immutable|invalid STABLE|checkout SHA mismatch|error|throw|failed|Publish isolated Dev repository' | tail -n 120 >> "$report" || true
          done
          rm .github/workflows/_inspect_publish_dev_once.yml
          git add "$report" .github/workflows/_inspect_publish_dev_once.yml
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Record publish-dev diagnostics"
          git push origin HEAD:main
