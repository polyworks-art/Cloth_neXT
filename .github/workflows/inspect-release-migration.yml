name: inspect-release-migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-release-migration.yml"

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Collect migration diagnostics
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/migration-diagnostics.txt"
          {
            echo "Release inventory"
            echo "================="
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | {id, tag_name, name, draft, prerelease, published_at, assets: [.assets[].name]}'
            echo
            echo "Recent migration workflow runs"
            echo "=============================="
            gh run list --workflow migrate-legacy-releases-to-pages.yml --limit 5 \
              --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url
          } > "$report"

          run_id="$(gh run list --workflow migrate-legacy-releases-to-pages.yml --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -n "$run_id" ] && [ "$run_id" != null ]; then
            {
              echo
              echo "Latest failed log"
              echo "================="
              gh run view "$run_id" --log-failed || true
            } >> "$report"
          fi

          cp "$report" migration-diagnostics.txt
          rm .github/workflows/inspect-release-migration.yml
          git add migration-diagnostics.txt .github/workflows/inspect-release-migration.yml
          git -c user.name=github-actions \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -m "Record release migration diagnostics"
          git push origin HEAD:main
