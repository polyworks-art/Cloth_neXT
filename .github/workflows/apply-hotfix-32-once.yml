name: Apply PR 32 hotfix once

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-character-cage-proxy-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-character-cage-proxy-ui
          fetch-depth: 0

      - id: pending
        name: Detect pending patch scripts
        shell: bash
        run: |
          if [[ -f maintenance/add_solver_struct_import.py ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
            echo "mode=followup" >> "$GITHUB_OUTPUT"
          elif [[ -f maintenance/apply_character_cage_proxy_ui_fix.py && \
                  -f maintenance/apply_animated_collider_cache_fix.py ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
            echo "mode=initial" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.pending.outputs.apply == 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        if: steps.pending.outputs.apply == 'true'
        run: pip install -r requirements-build.txt

      - name: Apply hotfix patch
        if: steps.pending.outputs.apply == 'true'
        shell: bash
        run: |
          if [[ "${{ steps.pending.outputs.mode }}" == "followup" ]]; then
            python maintenance/add_solver_struct_import.py
          else
            python maintenance/prepare_hotfix_patch_scripts.py
            python maintenance/apply_character_cage_proxy_ui_fix.py
            python maintenance/apply_animated_collider_cache_fix.py
          fi

      - name: Validate focused regression suite
        if: steps.pending.outputs.apply == 'true'
        run: |
          pytest -q tests/test_phase3b_material_ui.py tests/test_solver_test_ui.py tests/test_export_cache.py tests/test_ppf_schema.py
          python tools/validate_extension.py cloth_next --phase source
          python -m compileall -q cloth_next tools

      - name: Commit product changes
        if: steps.pending.outputs.apply == 'true'
        run: |
          git config user.name polyworks-art
          git config user.email 78053410+polyworks-art@users.noreply.github.com
          git add -A
          git commit -m "Finish PR 32 animated Collider cache hotfix"
          git push origin HEAD:agent/fix-character-cage-proxy-ui
