name: One-time Dev 2.1.22 package inspector

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  inspect:
    if: >-
      github.event.issue.number == 28 &&
      github.event.comment.user.login == 'polyworks-art' &&
      github.event.comment.body == '/inspect-dev-2.1.22'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Inspect published package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import zipfile
          from pathlib import Path

          archive = Path('pages/dev/cloth_next-2.1.22-windows-x64.zip')
          result = {
              'archive_exists': archive.is_file(),
              'archive_size': archive.stat().st_size if archive.is_file() else None,
          }
          if archive.is_file():
              with zipfile.ZipFile(archive) as bundle:
                  names = set(bundle.namelist())
                  cage_candidates = sorted(name for name in names if 'character_collision_cage' in name)
                  result['cage_files'] = cage_candidates
                  result['physics_ui_files'] = sorted(name for name in names if name.endswith('blender/physics_ui.py'))
                  result['object_properties_files'] = sorted(name for name in names if name.endswith('blender/object_properties.py'))
                  result['dev_build_files'] = sorted(name for name in names if name.endswith('dev_build.json'))
                  checks = {}
                  for label, suffix in {
                      'physics_ui': 'blender/physics_ui.py',
                      'object_properties': 'blender/object_properties.py',
                      'collider_proxy': 'blender/collider_proxy.py',
                  }.items():
                      matches = sorted(name for name in names if name.endswith(suffix))
                      if not matches:
                          checks[label] = {'present': False}
                          continue
                      text = bundle.read(matches[0]).decode('utf-8', errors='replace')
                      checks[label] = {
                          'present': True,
                          'character_collision_cage_text': 'Character Collision Cage' in text,
                          'character_cage_identifier': 'CHARACTER_CAGE' in text,
                          'proxy_mode_property': 'collider_proxy_mode' in text,
                      }
                  result['checks'] = checks
                  if result['dev_build_files']:
                      raw = bundle.read(result['dev_build_files'][0]).decode('utf-8', errors='replace')
                      try:
                          result['dev_build'] = json.loads(raw)
                      except Exception:
                          result['dev_build_raw'] = raw[:1000]

          body = '## Dev 2.1.22 package inspection\n\n```json\n' + json.dumps(result, indent=2, sort_keys=True) + '\n```'
          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues/28/comments',
              data=json.dumps({'body': body}).encode('utf-8'),
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'cloth-next-package-inspector',
              },
              method='POST')
          with urllib.request.urlopen(request):
              pass

          workflow = '.github/workflows/inspect-dev-2.1.22-once.yml'
          encoded = urllib.parse.quote(workflow, safe='/') if False else workflow
          api_path = workflow.replace('/', '%2F')
          get_request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/contents/{workflow}?ref=main',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'cloth-next-package-inspector',
              })
          with urllib.request.urlopen(get_request) as response:
              current = json.load(response)
          delete_request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/contents/{workflow}',
              data=json.dumps({
                  'message': 'Remove completed Dev 2.1.22 package inspector',
                  'sha': current['sha'],
                  'branch': 'main',
              }).encode('utf-8'),
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'cloth-next-package-inspector',
              },
              method='DELETE')
          with urllib.request.urlopen(delete_request):
              pass
          PY