name: Run one-time Protocol 0.13 timebase fix

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-protocol-013-animation-timebase
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-build.txt
      - run: python maintenance/apply_protocol_013_timebase_fix.py
      - name: Validate focused regression suite
        run: |
          pytest -q tests/test_ppf_schema.py tests/test_static_pinning.py tests/test_solver_test_ui.py
          python tools/validate_extension.py cloth_next --phase source
          python -m compileall -q cloth_next
      - name: Commit and push fix
        run: |
          git config user.name polyworks-art
          git config user.email 78053410+polyworks-art@users.noreply.github.com
          git add -A
          git commit -m "Fix Protocol 0.13 animation timebase"
          git push origin HEAD:agent/fix-protocol-013-animation-timebase
      - name: Report result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          body = '''Protocol 0.13 timing patch applied and focused validation passed.\n\n- dense collider sub-samples are reduced to one pose per Blender frame for schema 2\n- schema 1 retains dense sub-frame samples\n- schema 2 scene FPS now follows the official `fps * time_scale` contract\n- regression tests cover the default 8-samples-per-frame case\n'''
          request = urllib.request.Request(
              'https://api.github.com/repos/polyworks-art/Cloth_neXT/issues/31/comments',
              data=json.dumps({'body': body}).encode('utf-8'),
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'cloth-next-timebase-fix',
              },
              method='POST')
          with urllib.request.urlopen(request):
              pass
          PY