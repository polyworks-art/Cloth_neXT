name: One-time Dev 2.1.22 dispatcher

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    if: >-
      github.event.issue.number == 28 &&
      github.event.comment.user.login == 'polyworks-art' &&
      github.event.comment.body == '/publish-dev-2.1.22'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch confirmation-gated Dev publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/actions/workflows/publish-dev.yml/dispatches"
          payload = json.dumps({
              "ref": "main",
              "inputs": {
                  "ref": "5bef12ea4e9c60279c0cafc5315d2a097182db6f",
                  "version": "2.1.22",
                  "build_note": "Character Collision Cage and expanded material library development snapshot",
                  "confirmation": "PUBLISH_DEV"
              }
          }).encode("utf-8")
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "cloth-next-dev-dispatcher"
          }
          request = urllib.request.Request(url, data=payload, headers=headers, method="POST")
          with urllib.request.urlopen(request) as response:
              if response.status != 204:
                  raise RuntimeError(f"Unexpected dispatch status: {response.status}")
          PY

      - name: Remove one-time dispatcher and merged feature branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "cloth-next-dev-dispatcher-cleanup"
          }

          workflow_path = ".github/workflows/dispatch-dev-2.1.22-once.yml"
          quoted_path = urllib.parse.quote(workflow_path, safe="/")
          content_url = f"https://api.github.com/repos/{repo}/contents/{quoted_path}?ref=main"
          with urllib.request.urlopen(urllib.request.Request(content_url, headers=headers)) as response:
              current = json.load(response)
          delete_payload = json.dumps({
              "message": "Remove completed Dev 2.1.22 dispatcher",
              "sha": current["sha"],
              "branch": "main"
          }).encode("utf-8")
          delete_request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/contents/{quoted_path}",
              data=delete_payload, headers=headers, method="DELETE")
          with urllib.request.urlopen(delete_request):
              pass

          branch_ref = urllib.parse.quote("heads/agent/character-collision-cage", safe="/")
          branch_request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/git/refs/{branch_ref}",
              headers=headers, method="DELETE")
          try:
              with urllib.request.urlopen(branch_request):
                  pass
          except urllib.error.HTTPError as exc:
              if exc.code != 422 and exc.code != 404:
                  raise
          PY
