name: Apply update smoke followup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/full-addon-simulation-pipeline-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-addon-simulation-pipeline-audit
          fetch-depth: 0
      - name: Apply verified followup
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/blender_update_smoke_test.py')
          source = path.read_text()
          old = '''    channel = updates.DEFAULT_CHANNEL
              channel_url = channel.index_url
              session = updates.session()

              # The unsafe self-install helper must stay deleted.
          '''
          new = '''    channel = updates.DEFAULT_CHANNEL
              channel_url = channel.index_url
              session = updates.session()
              if channel is updates.UpdateChannel.DEV:
                  # This build intentionally encodes the Dev channel. Exercise the real
                  # acknowledgement property instead of bypassing the production gate.
                  preferences = updates.addon_preferences(bpy.context, updates.__package__)
                  preferences.dev_channel_acknowledged = True

              # The unsafe self-install helper must stay deleted.
          '''
          if source.count(old) != 1:
              raise SystemExit('expected update-smoke insertion point was not unique')
          path.write_text(source.replace(old, new))
          PY
          python -m compileall -q tools/blender_update_smoke_test.py
          rm .github/workflows/apply-update-smoke-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Acknowledge Dev channel in real update smoke"
          git push origin HEAD:agent/full-addon-simulation-pipeline-audit
