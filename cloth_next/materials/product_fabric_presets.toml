# Cloth NeXt real-world product material samples (read-only).
#
# These presets use published product mass and construction data. PPF-specific
# stretch, bending, Poisson response, friction, and strain limits are artist-
# oriented calibrations for the documented product class; they are not vendor
# certifications and do not claim an exact digital twin of any commercial
# material. Product and manufacturer names are nominative references only.

[provenance]
source_project = "Official manufacturer product data and cited technical sample listings"
source_commit = "retrieved-2026-07-29"
source_path = "docs/MATERIAL_LIBRARY_SOURCES.md"
source_license = "Facts-only technical reference metadata; no third-party code or product media redistributed"
notes = "Published areal weights and constructions are retained; solver-only values are clearly marked as calibrated behavior. All trademarks belong to their respective owners."

